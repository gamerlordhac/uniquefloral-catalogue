backend:
  name: git-gateway
  branch: main
media_folder: "images"
public_folder: "/images"
site_url: "/"
logo_url: "/images/unique-floral-logo-current.png"
locale: "en"
collections:
  - name: "catalogue"
    label: "Shop catalogue"
    files:
      - name: "catalogue"
        label: "Catalogue and products"
        file: "content/catalogue.json"
        format: "json"
        fields:
          - { label: "Shop name", name: "title", widget: "string", default: "Unique Floral", hint: "Shown at the top of your customer catalogue." }
          - { label: "Welcome message", name: "intro", widget: "text", default: "Thoughtfully made flowers, arranged by hand. Find something lovely at a price that feels right.", hint: "A short introduction customers see on the catalogue page." }
          - { label: "WhatsApp number", name: "whatsappNumber", widget: "string", required: false, hint: "Enter the full number with Ghana country code 233, digits only." }
          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "product"
            summary: "{{fields.name}} · GH₵{{fields.price}}"
            add_to_top: true
            collapsed: true
            hint: "Add a flower arrangement, plant, or extra. Remove a product with its delete icon. Changes appear on the customer catalogue after publishing."
            fields:
              - { label: "Product name", name: "name", widget: "string", hint: "A clear name customers will recognise." }
              - { label: "Price (GH₵)", name: "price", widget: "number", value_type: "float", min: 0, step: 0.01 }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Bouquet", "Arrangement", "Wreath", "Casket Spray", "Bridal Bouquet"]
              - { label: "Description", name: "description", widget: "text", required: false, hint: "Optional short description." }
              - { label: "Product photo", name: "image", widget: "image", required: false, hint: "Upload a photo of this item. Landscape images work well." }



